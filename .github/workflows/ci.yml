name: CI
on:
  push:
    branches: [main, 'release/v*']
    tags: ['v*']
  pull_request:
    branches: [main, 'release/v*']
  # A queued merge is the last point at which a change can still be blocked: it
  # is re-tested against the CURRENT base, which a green PR run never saw.
  merge_group:
  workflow_dispatch:
    inputs:
      run_teranode:
        description: 'Also run the integration suite against a Teranode node (heavy; opt-in)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pin turbo's filesystem cache to the path the `Cache turbo build outputs`
  # steps below persist. This is also turbo 2.x's default, so the pin only
  # protects against a future default change silently turning the cache steps
  # into no-ops.
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  # ---------------------------------------------------------------------------
  # Lint — block reintroduction of dishonest test patterns
  # ---------------------------------------------------------------------------

  lint-no-silent-skips:
    name: Lint — no silent test skips, no active TODO markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/lint-no-silent-skips.sh (composite lint)
        # The same script runs locally via `pnpm run lint:silent-skips`. It
        # covers three cohorts:
        #   1. Zig integration silent-skip surface markers (the 162-instance
        #      catch-and-bare-return antipattern that reports PASS).
        #   2. Active TODO/FIXME/XXX/todo!/unimplemented! markers in source
        #      code — they're forbidden; finish the work or remove them.
        #   3. Test-skip surface markers cross-checked against
        #      docs/test-skips.md so every documented skip stays the audit
        #      trail of the only legitimate skip paths in the corpus.
        run: bash scripts/lint-no-silent-skips.sh
      - name: Assert all tier versions are consistent
        # DOC-001 drift gate: every compiler/SDK manifest, Cargo.lock, gradle
        # module, and embedded version string must agree. The checker already
        # exists; this wires it into the merge gate so a mismatch (e.g. one
        # tier bumped without the others) fails the PR instead of shipping.
        run: bash scripts/bump-version.sh --check

  conformance-allowlist-audit:
    # Pin which conformance fixtures are allowed to opt out of compiler tiers
    # via source.json's `compilers` allowlist. New / changed allowlists must
    # land in conformance/runner/__tests__/allowlist-audit.test.ts AND in
    # conformance/README.md ("Per-fixture compiler allowlist") in the same
    # commit. Cheap (~10 s with pnpm install) — gates the rest of CI like
    # lint-no-silent-skips so a drift here short-circuits the heavy matrix.
    name: Lint — conformance allowlist audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run allowlist audit (vitest)
        run: pnpm run conformance:allowlist-audit

  golden-provenance-gate:
    # GOLDEN-REGENERATION INTEGRITY GATE (issue #122). Conformance goldens /
    # vectors (expected-script.hex, expected-ir.json, runtime-vectors/*.json,
    # sdk-output/**/expected-locking.hex, analyzer + source-map goldens, the
    # decompiler baseline) are SELF-PRODUCED by the implementation under test
    # (`pnpm run update-golden`). Nothing else stops a PR from silently
    # regenerating one to match a buggy new compiler output — the suite then
    # validates the corrupt bytes against itself and ships green. This gate
    # fails the PR if any golden changed WITHOUT an independent provenance
    # justification: either (A) the fixture's own witnesses/<fixture>.json
    # co-changed (differential oracle re-checks it via a second engine), or
    # (B) a content-pinned entry in conformance/golden-provenance-allowlist.json
    # (sha256 + verified-against + reason + reviewer sign-off). Cheap (Node
    # built-ins only, no install) — gates the heavy matrix like the other lints.
    #
    # Security note: the only github.event.* value consumed is the base commit
    # SHA, passed via `env:` (never interpolated into the shell) and used solely
    # as a git ref for the three-dot diff. No untrusted event text reaches a
    # `run:` block.
    name: Lint — golden-regeneration provenance gate
    runs-on: ubuntu-latest
    # A merged golden change on `main` is already landed; the gate is a PR
    # admission control, so scope it to pull_request events.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base commit is present for the merge-base
          # three-dot diff below.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check golden/vector provenance (changed set vs merge-base)
        env:
          # base.sha = tip of the branch this PR merges into. The script diffs
          # `<base>...HEAD` (three-dot = merge-base) to get the PR's true
          # changed set, so an already-merged commit from another PR is never
          # misattributed here.
          GOLDEN_GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node conformance/scripts/check-golden-provenance.mjs
      - name: Self-test the gate (both directions)
        # Belt-and-suspenders: proves the checker still rejects an unjustified
        # golden change and passes a justified one, so the gate can't silently
        # rot into a no-op that greenlights everything.
        run: node conformance/scripts/check-golden-provenance.mjs --self-test

  go-only-crypto-vectors:
    # RESEARCH-VECTOR ORACLE GATE (v1 audit — Go-only crypto).
    #
    # BabyBear, KoalaBear, Poseidon2, BN254/Groth16, Merkle and the SP1 FRI
    # verifier ship Stack-IR codegen in the GO TIER ONLY by project policy, so
    # the repo's headline cross-tier parity invariant proves NOTHING about them:
    # one implementation cannot disagree with itself. `tests/vectors/*.json` is
    # their entire oracle. Two independent things are checked here.
    #
    # 1. Reproducibility. The vectors are derived from Plonky3 (p3-baby-bear,
    #    p3-koala-bear, p3-poseidon2) and gnark-crypto, but "derived from
    #    Plonky3" used to be a claim in a comment with nothing enforcing it. The
    #    script re-runs every generator and fails if one byte of any checked-in
    #    vector moves, so an upstream drift or a hand-edit is loud instead of
    #    silent.
    # 2. BN254 pairing invariants. The pairing is the most security-critical
    #    operation in the Groth16 path and has no upstream KAT here, so the
    #    corpus is checked algebraically instead — bilinearity classes, must-be-
    #    identity vectors, negative controls, canonicity and a coverage floor.
    name: Test — Go-only crypto research vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
      - name: BN254 pairing invariants (algebraic, no upstream KAT needed)
        run: node conformance/scripts/check-bn254-pairing-invariants.mjs
      - name: Self-test the invariant checker (both directions)
        run: node conformance/scripts/check-bn254-pairing-invariants.mjs --self-test
      - name: Vectors reproduce byte-for-byte from Plonky3 + gnark-crypto
        run: tests/generate-vectors/verify-reproducible.sh

  wire-format-must-move-golden:
    # MUST-MOVE-A-GOLDEN GATE (testing-gap plan §0.1 reviewer #3 / §3 Phase F1,
    # finding TG-011). Complement of the golden-provenance gate above: that one
    # asks "you changed a golden — prove the new bytes are right"; this one asks
    # "you changed a wire ENCODER and no golden moved — then nothing checked the
    # bytes at all".
    #
    # Why it exists: in 2026-08 a change altered the state-section wire framing
    # in ALL SEVEN SDK serializers and moved ZERO pinned bytes. Every suite was
    # green, because the encoder and decoder were co-changed and every test was a
    # round-trip — `deserialize(serialize(x)) === x` holds for any self-consistent
    # framing, including a wrong one. The result was a state section the compiler
    # no longer agreed with. A wire-format change that moves no pinned bytes is
    # untested by definition, so it blocks instead of reassuring.
    #
    # Runs on pull_request, on merge_group, AND on push to main / release/*.
    # bd7ec284 — the commit this gate exists for — is on main's FIRST-PARENT
    # chain: pushed directly, never a PR (only 5 of the last 100 commits
    # reachable from main are PR merges). A pull_request-only gate would have
    # watched it go straight past.
    #
    # Security note: the only github.event.* values consumed are the base branch
    # NAME and base commit SHAs, passed via `env:` (never interpolated into the
    # shell) and used solely as git refs for the merge-base diff.
    name: Lint — wire-format must-move-a-golden gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history AND every remote branch, so `origin/<base branch>` is
          # present for the run-time merge-base resolution below.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # conformance/ is standalone npm (not a pnpm workspace member); its
      # devDependencies provide the tsx used to run the gate.
      - run: cd conformance && npm ci
      - name: Self-test the gate (glob liveness + #110 regression)
        # Runs on EVERY event, not just pull_request: the liveness assertions
        # prove each wire glob still matches a real file, so a rename on main
        # that turns a glob into a permanent no-op is caught the moment it
        # lands. A gate whose globs match nothing is worse than no gate — it
        # reports green forever.
        run: pnpm run wire-format-audit:self-test
      - name: Wire-format audit (changed set vs merge-base)
        # Fail mode (the plan allows a one-PR warn phase via `--warn-only`; the
        # flag exists on the script but CI is wired to fail).
        env:
          # A base REF, not a pinned SHA. `pull_request.base.sha` is the base tip
          # as of the PR's last sync, while the checkout is refs/pull/N/merge
          # against the CURRENT base — so diffing from that SHA sweeps in every
          # golden other PRs merged in between, and one of THOSE satisfies this
          # gate for a PR that moved nothing. The script resolves
          # `git merge-base <ref> HEAD` at run time instead.
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          # push: the tip before this push. Falls back to HEAD^ (the merge's
          # first parent) when it is unavailable, e.g. a force-push or a tag.
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE_REF:-}" ]; then
            base="origin/${PR_BASE_REF}"
            # fetch-depth: 0 already creates this ref; fetch it explicitly if a
            # future checkout change ever stops doing so, so the gate keeps
            # working instead of hard-failing every PR.
            git rev-parse --verify -q "${base}^{commit}" >/dev/null \
              || git fetch --no-tags origin "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          elif [ -n "${MERGE_GROUP_BASE:-}" ]; then
            base="${MERGE_GROUP_BASE}"
          elif [ -n "${PUSH_BEFORE:-}" ] \
            && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="${PUSH_BEFORE}"
          else
            # --verify -q so a root commit (no HEAD^) prints nothing instead of
            # echoing the unresolved "HEAD^" into $base.
            base="$(git rev-parse --verify -q HEAD^ || git rev-parse --verify HEAD)"
          fi
          echo "wire-format gate base ref: ${base}"
          WIRE_FORMAT_GATE_BASE="${base}" pnpm run wire-format-audit

  sdk-envelope-fixtures:
    # Guards the signed-envelope wire protocol's cross-tier fixture. The
    # fixture is the frozen TS-reference bytes that all 6 non-TS SDKs validate
    # against (canonicalJson + signEnvelope/verifyEnvelope). Two silent-failure
    # modes this job closes:
    #   1. TS drift — if TS's canonicalJson/signing path changes but the
    #      committed fixtures.json does not, the consumers keep validating
    #      against stale bytes and a real TS regression ships green. The
    #      validator recomputes every canonical vector + re-verifies the
    #      envelope signature against the committed fixture and fails on drift.
    #   2. Dropped coverage — the per-tier interop tests run inside each SDK
    #      job (go test, cargo test, ...), with no central re-run. If a tier's
    #      test glob ever stops picking up its interop file, cross-tier parity
    #      silently stops being checked.
    name: Lint — SDK envelope fixture drift + interop coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate envelope fixture against the TS reference (drift guard)
        run: cd conformance && npx tsx sdk-envelope/validate-fixtures.ts
      - name: Assert every non-TS SDK has an envelope interop test wired to the fixture
        run: |
          set -euo pipefail
          files=(
            "packages/runar-go/sdk_envelope_interop_test.go"
            "packages/runar-rs/tests/envelope_interop.rs"
            "packages/runar-py/tests/test_envelope_interop.py"
            "packages/runar-zig/src/sdk_envelope_interop_test.zig"
            "packages/runar-rb/spec/runar/sdk/envelope_interop_spec.rb"
            "packages/runar-java/src/test/java/runar/lang/sdk/EnvelopeInteropTest.java"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing envelope interop test: $f"
              missing=1
            elif ! grep -q "sdk-envelope" "$f"; then
              echo "::error::$f no longer references conformance/sdk-envelope/fixtures.json"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Cross-tier envelope interop coverage is incomplete. See conformance/sdk-envelope/."
            exit 1
          fi
          echo "All 6 non-TS SDK envelope interop tests present and wired to the fixture."

  sdk-bip143-fixtures:
    # Guards the cross-tier BIP-143 transaction-sighash fixture (GAP-003). The
    # fixture is the frozen TS-reference preimage + deterministic RFC-6979
    # signature that all seven SDKs replay: each tier recomputes the BIP-143
    # preimage and verifies the signature, proving the SDKs agree on preimage
    # assembly (not just that each agrees with the node). Same two silent-
    # failure modes as the envelope job: TS drift vs the committed fixture, and
    # a tier silently dropping its interop test from its suite.
    name: Lint — SDK BIP-143 fixture drift + interop coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate BIP-143 fixture against the TS reference (drift guard)
        run: cd conformance && npx tsx sdk-bip143/generate-fixtures.ts --check
      - name: Assert every SDK has a BIP-143 interop test wired to the fixture
        run: |
          set -euo pipefail
          files=(
            "packages/runar-go/sdk_bip143_interop_test.go"
            "packages/runar-rs/tests/bip143_interop.rs"
            "packages/runar-py/tests/test_bip143_interop.py"
            "packages/runar-rb/spec/runar/sdk/bip143_interop_spec.rb"
            "packages/runar-zig/src/sdk_bip143_interop_test.zig"
            "packages/runar-java/src/test/java/runar/lang/sdk/Bip143InteropTest.java"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing BIP-143 interop test: $f"
              missing=1
            elif ! grep -q "sdk-bip143" "$f"; then
              echo "::error::$f no longer references conformance/sdk-bip143/fixtures.json"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Cross-tier BIP-143 interop coverage is incomplete. See conformance/sdk-bip143/."
            exit 1
          fi
          echo "All 6 non-TS SDK BIP-143 interop tests present and wired to the fixture."

  # ---------------------------------------------------------------------------
  # Compilers — build, unit test, upload artifacts
  # ---------------------------------------------------------------------------

  ts-compiler:
    name: TypeScript Compiler
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    env:
      # Force the cross-compiler vitest matrix to hard-fail when any of the
      # 7 toolchains is missing (instead of skipping with a warning). This
      # job installs every toolchain the matrix references.
      RUNAR_REQUIRE_ALL_COMPILERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: compilers/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo registry + target dir. Rust builds dominate this job's
      # wall clock and the inputs (Cargo.lock + rustc version) are stable
      # between runs, so a cache hit skips a full dependency rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compilers/rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Rust compiler (for cross-compiler tests)
        run: cd compilers/rust && cargo build --release
      - name: Warm Go build cache (for cross-compiler tests)
        run: cd compilers/go && go build ./...
      - name: Build Go compiler binary (for the 7-tier validation-parity tests)
        # `go build ./...` warms the cache but emits no binary. The NEW-002 /
        # NEW-001 parity suites spawn each tier's CLI and FAIL rather than skip
        # when one is absent — that is deliberate, so the seven-tier claim
        # cannot pass vacuously — which means the binary has to exist here.
        run: cd compilers/go && go build -o runar-go .
      - name: Build Zig compiler (for cross-compiler tests)
        run: cd compilers/zig && zig build -Doptimize=ReleaseSafe
      - name: Build Java compiler jar (for cross-compiler tests)
        run: cd compilers/java && gradle jar --no-daemon
      # ---- turbo build-output cache (shared by every job that runs
      #      `pnpm run build`) -------------------------------------------------
      # Seven jobs in this workflow (plus four in fuzzer-nightly.yml and one in
      # cross-compiler-bytewise.yml) rebuild the same TypeScript packages from
      # scratch. turbo already content-hashes each package's inputs and stores
      # its `dist/**` outputs under .turbo/cache, so persisting that directory
      # lets the other jobs replay the outputs instead of re-running tsc.
      #
      # STALENESS SAFETY: the key below decides only WHICH cache directory is
      # downloaded, never which outputs are reused. turbo re-computes a content
      # hash per package (package files + its dependencies' hashes + lockfile-
      # derived external deps + task definition) on every run and only replays
      # an entry whose hash matches exactly; anything else is rebuilt. A stale
      # `dist/` therefore cannot be served even from a coarse restore-keys hit.
      # The one input turbo does NOT hash is the repo-root build config
      # (tsconfig.base.json, which every package extends, plus turbo.json /
      # pnpm-workspace.yaml / package.json / the lockfile), so that config's
      # hash is baked into BOTH the key and the restore-keys prefix: changing
      # any of them can only miss into a cold cache, never fall back to an entry
      # produced under the old config.
      #
      # This job is the single writer — it gates the other TypeScript jobs
      # (conformance, decompiler-roundtrip, sdk-conformance, script-execution,
      # integration all `needs:` it) and it builds the whole workspace, so its
      # cache is complete. Every other job restores read-only, which avoids
      # N concurrent jobs racing to reserve the same cache key.
      - name: Cache turbo build outputs (writer)
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-
      - name: Prune turbo cache entries not touched in 14 days
        # The restored directory keeps one tarball per distinct task hash
        # forever, so drop the entries no recent build has replayed before this
        # job re-saves it. Bounds cache size; never affects correctness (a
        # pruned entry is simply rebuilt).
        run: find .turbo/cache -type f -mtime +14 -delete 2>/dev/null || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      - name: GAP-101 — fold-ON⇄fold-OFF ScriptVM equivalence oracle
        # Compiles each fold-relevant fixture with folding ON and OFF and asserts
        # both compiled scripts reach the identical accept/reject verdict through
        # the BSV Spend interpreter — a correctness oracle for the fold pass beyond
        # cross-tier byte agreement (catches an all-7-tier-shared fold bug).
        run: npx vitest run packages/runar-testing/src/__tests__/fold-equivalence.test.ts
      - name: Fuzzer regression corpus replay
        # Replays every checked-in minimised fuzzer reproducer under
        # conformance/fuzz-regressions/entries/ through the same source-vs-script
        # differential oracle the `--execute` fuzzer uses. The nightly fuzzer only
        # keeps a finding for `retention-days: 30` as a CI artifact, so without
        # this gate a fixed bug stops being covered and has to be rediscovered by
        # chance. Deterministic (no seed, no network) and sub-second for the whole
        # corpus, so it runs on every PR rather than nightly.
        # See conformance/fuzz-regressions/README.md.
        run: |
          cd conformance
          npm ci
          npx tsx fuzz-regressions/replay.ts
      - name: Example tests (TS + Sol + Move)
        run: npx vitest run examples/ts/ examples/sol/ examples/move/
      - run: pnpm run typecheck

  go-compiler:
    name: Go Compiler
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: compilers/go/go.sum
      - run: cd compilers/go && go build ./...
      - run: cd compilers/go && go build -o runar-go .
      - run: cd compilers/go && go test -race -v ./...
      - uses: actions/upload-artifact@v4
        with:
          name: runar-go
          path: compilers/go/runar-go

  rust-compiler:
    name: Rust Compiler
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo registry + target dir. Rust builds dominate this job's
      # wall clock and the inputs (Cargo.lock + rustc version) are stable
      # between runs, so a cache hit skips a full dependency rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            compilers/rust
      - run: cd compilers/rust && cargo build --release
      - run: cd compilers/rust && cargo test
      - uses: actions/upload-artifact@v4
        with:
          name: runar-rust
          path: compilers/rust/target/release/runar-compiler-rust

  python-compiler:
    name: Python Compiler
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: cd compilers/python && python -m pytest tests/ -v

  zig-compiler:
    name: Zig Compiler
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: cd compilers/zig && zig build test
      - name: Zig conformance tests
        run: cd compilers/zig && zig build conformance
      - name: Build release binary
        # ReleaseSafe + baseline CPU: ReleaseFast was SIGILL-ing on heavier
        # conformance fixtures on the conformance runner (different ubuntu-
        # latest SKU than the build runner). Baseline target keeps the binary
        # portable across runner CPUs; ReleaseSafe keeps overflow + bounds
        # checks so any remaining bug surfaces as a panic with file:line
        # instead of a bare SIGILL.
        run: cd compilers/zig && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu -Dcpu=baseline
      - uses: actions/upload-artifact@v4
        with:
          name: runar-zig
          path: compilers/zig/zig-out/bin/runar-zig

  java-compiler:
    name: Java Compiler
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Java compiler
        run: cd compilers/java && gradle build --no-daemon
      - name: Java compiler unit tests
        run: cd compilers/java && gradle test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: runar-java
          path: compilers/java/build/libs/*.jar

  ruby-compiler:
    name: Ruby Compiler
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Ruby compiler unit tests
        run: cd compilers/ruby && rake test
      - name: Ruby compiler conformance (IR -> hex)
        run: |
          fail=0
          for test in conformance/tests/*/expected-ir.json; do
            dir=$(dirname "$test")
            name=$(basename "$dir")
            expected=$(tr -d '[:space:]' < "$dir/expected-script.hex" | tr '[:upper:]' '[:lower:]')
            actual=$(ruby compilers/ruby/bin/runar-compiler-ruby --ir "$test" --hex --disable-constant-folding 2>&1 | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$expected" = "$actual" ]; then
              echo "PASS $name"
            else
              echo "FAIL $name"
              fail=1
            fi
          done
          exit $fail
      # Note: cross-compiler multi-format source conformance lives in the
      # dedicated `conformance` job below, which depends on every
      # compiler-build job and installs every toolchain. Running it here
      # would require this Ruby-only job to also install Go, Rust, Python,
      # Zig, and Java — duplicating ~5 minutes of setup for no extra
      # coverage. Ruby's source.json entries are exercised by the central
      # job alongside every other tier.

  # ---------------------------------------------------------------------------
  # SDKs — package tests + example tests
  # ---------------------------------------------------------------------------

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: packages/runar-go/go.sum
      - name: SDK tests
        run: cd packages/runar-go && go test ./...
      - name: Example tests
        run: cd examples/go && go test ./...

  rust-sdk:
    name: Rust SDK
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo registry + target dir. Rust builds dominate this job's
      # wall clock and the inputs (Cargo.lock + rustc version) are stable
      # between runs, so a cache hit skips a full dependency rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/runar-rs
            examples/rust
      - name: SDK tests
        run: cd packages/runar-rs && cargo test
      - name: Example tests
        run: cd examples/rust && cargo test

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `slh-dsa` is the FIPS 205 reference impl. We install it in CI so the
      # SPHINCSWallet / post-quantum-slhdsa-naive negative tests run their
      # real-crypto path (matching the @_slow @_requires_slhdsa marker pair
      # in those test files). Locally devs can omit it; pytest's skipif
      # gate falls back to the documented environmental skip — see
      # docs/test-skips.md.
      #
      # `bsv-sdk` is the upstream BSV SDK that `runar.sdk.script_vm` wraps
      # (T-8 from audits/cross-language-completeness-20260514.md §5.2). We
      # install it in CI so test_script_vm.py runs its real path instead of
      # silently skipping via `pytest.importorskip("bsv")`. The companion
      # CI-gate in test_script_vm.py FAILS the suite if bsv-sdk is missing
      # when `$CI` is set, so a regression here is caught loudly.
      - run: pip install pytest slh-dsa bsv-sdk
      - name: SDK tests
        run: cd packages/runar-py && python -m pytest
      - name: Example tests (real SLH-DSA enabled via slh-dsa pkg)
        run: cd examples/python && PYTHONPATH=../../packages/runar-py python -m pytest

  zig-sdk:
    name: Zig SDK
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: SDK tests
        run: cd packages/runar-zig && zig build test
      - name: Example tests
        run: cd examples/zig && zig build test

  ruby-sdk:
    name: Ruby SDK
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/runar-rb
      - name: SDK tests
        run: cd packages/runar-rb && bundle exec rspec
      - name: Example tests
        run: |
          cd examples/ruby
          bundle install
          bundle exec rspec **/*_spec.rb

  java-sdk:
    name: Java SDK
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK tests
        run: cd packages/runar-java && gradle test --no-daemon
      - name: Example tests
        run: cd examples/java && gradle test --no-daemon
      - name: Build conformance SDK driver
        run: cd conformance/sdk-output/tools/java-driver && gradle fatJar --no-daemon

  # ---------------------------------------------------------------------------
  # Conformance — cross-compiler + SDK output
  # ---------------------------------------------------------------------------

  conformance:
    name: Conformance Tests
    needs: [ts-compiler, go-compiler, rust-compiler, python-compiler, zig-compiler, ruby-compiler, java-compiler]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: runar-go
      - uses: actions/download-artifact@v4
        with:
          name: runar-rust
      - uses: actions/download-artifact@v4
        with:
          name: runar-zig
      - uses: actions/download-artifact@v4
        with:
          name: runar-java
          path: compilers/java/build/libs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x runar-go runar-compiler-rust runar-zig
      - name: Locate Java compiler jar
        id: java-jar
        run: |
          jar=$(ls compilers/java/build/libs/runar-java-compiler-*.jar | head -1)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
      # The previous "Ruby format conformance (source -> hex)" step searched for
      # `<case>.runar.rb` files inside each conformance/tests/<case>/ directory,
      # but sources now live under `examples/` and are referenced from
      # `source.json`. The shell loop was a silent no-op. The shared multi-format
      # runner below subsumes it: it reads every source.json entry (TS, Sol,
      # Move, Go, Rust, Python, Zig, Ruby, Java) and drives all 7 compilers.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: compilers/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Read-only restore of the turbo build-output cache written by the
      # ts-compiler job (this job `needs:` it, so the same-commit entry exists).
      # See that job's writer step for the staleness argument. `pnpm run build`
      # below still runs and rebuilds anything whose turbo hash does not match.
      - name: Restore turbo build outputs
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # conformance/ is not a pnpm workspace member (uses npm + package-lock.json
      # for its tsx loader + fast-check fuzzer). The runner spawns subprocesses
      # that import tsx from REPO_ROOT/conformance/node_modules, so install its
      # deps explicitly before the multi-format step.
      - run: cd conformance && npm ci
      - name: Typecheck conformance/ (runner, fuzzer, fuzz-regressions, tests, scripts)
        # conformance/ is a standalone npm project, not a pnpm workspace member,
        # so it is invisible to `turbo run typecheck` (workspace packages only)
        # and had never been typechecked — conformance/tsconfig.json's rootDir
        # didn't account for the fuzzer's relative imports into sibling
        # packages/runar-*/src, so every run failed before reaching a single
        # real error. Fixed in conformance/tsconfig.json; this step keeps it
        # from rotting back to unchecked.
        run: pnpm run conformance:typecheck
      - name: Run IR -> hex cross-tier parity (all 6 non-TS compilers)
        # Compiles every fixture's checked-in expected-ir.json with all six
        # non-TS tiers and requires byte-identical hex plus equality with
        # expected-script.hex — the `--ir` loader / Stack-IR / emit gate.
        #
        # This used to be ~180 lines of inline bash/jq with its OWN copy of
        # the per-fixture `compilers` allowlist rule, which could (and did)
        # drift from the TypeScript runner's copy. The runner is now the
        # single source of truth: see the "IR -> hex cross-tier parity"
        # block in conformance/runner/runner.ts. Semantics are unchanged —
        # allowlist-scoped, fold-OFF, Go as the comparison reference.
        env:
          JAVA_JAR: ${{ steps.java-jar.outputs.path }}
        run: conformance/node_modules/.bin/tsx conformance/runner/index.ts --tests-dir conformance/tests --ir-parity
      - name: Run all-tier parser-only coverage (every compiler × every fixture × every format)
        # Universal frontend coverage: every available compiler runs
        # `--parse-only` on every fixture × every declared format. The
        # per-fixture `compilers` allowlist in source.json is intentionally
        # IGNORED here — that allowlist scopes Stack-IR / hex parity, not
        # the parser layer. This step gates the central claim that "every
        # tier parses every fixture in every one of the nine source
        # formats" (see spec/README.md and conformance/README.md).
        env:
          JAVA_JAR: ${{ steps.java-jar.outputs.path }}
        run: conformance/node_modules/.bin/tsx conformance/runner/index.ts --tests-dir conformance/tests --parser-only
      - name: Cross-tier rejection parity (programs that must NOT compile)
        # The parser-only step above proves every tier ACCEPTS what it should.
        # Nothing proved they agree on what to REFUSE, and that gap let a Go
        # statement-drop reach RC: malformed input was silently discarded and
        # the tier emitted a locking script the other six rejected. This runs
        # the negative corpus against every built tier.
        env:
          JAVA_JAR: ${{ steps.java-jar.outputs.path }}
        run: cd conformance && npx vitest run negatives/
      - name: Run multi-format source conformance (all 7 compilers, all 9 formats)
        # Adds the TypeScript compiler to the central conformance job (it was
        # previously absent) and exercises every compiler's frontend against
        # every declared source.json entry, not just the IR -> hex path above.
        # Default mode: every compiler runs with `--disable-constant-folding`,
        # matching the fold-off semantics of the checked-in
        # expected-ir.json / expected-script.hex goldens.
        env:
          JAVA_JAR: ${{ steps.java-jar.outputs.path }}
        run: conformance/node_modules/.bin/tsx conformance/runner/index.ts --tests-dir conformance/tests --multi-format
      - name: Run multi-format source conformance (fold ON, cross-tier parity only)
        # Companion run: every compiler executes with constant folding ENABLED
        # (its end-user default) and the runner enforces cross-tier hex + ANF
        # parity across all 7 tiers, while skipping the golden-file comparison
        # (the checked-in goldens were stamped fold-OFF). This catches latent
        # fold bugs that the historical fold-off-only loop would have missed
        # — see the MEDIUM review finding on "Constant-folding coverage is
        # weaker than runtime coverage". If a real cross-tier divergence
        # appears here in future, list the fixture in
        # `conformance/fold-on-allowlist.json` (with a one-line justification
        # per the file's contract) instead of silently skipping it.
        env:
          JAVA_JAR: ${{ steps.java-jar.outputs.path }}
          RUNAR_DISABLE_CONSTANT_FOLDING: '0'
        run: conformance/node_modules/.bin/tsx conformance/runner/index.ts --tests-dir conformance/tests --multi-format
      - name: Per-fixture differential execution (source vs script, fold-ON)
        # TS-GAP-001 / TS-GAP-004: the source-vs-script execution oracle. For
        # every witnessed fixture, compile to fold-ON deployed bytes, then run
        # each declared valid + near-miss spend through BOTH the ANF interpreter
        # (source semantics) and the @bsv/sdk ScriptVM (script semantics) and
        # require they agree on accept/reject. This catches a bug all seven
        # compilers share (byte-identical but wrong). completeness.test.ts in
        # the same directory (completeness.test.ts) fails CI if any fixture is
        # neither witnessed nor listed in the coverage ledger
        # (conformance/witnesses/coverage-ledger.json).
        run: cd conformance && npx vitest run witnesses/
      - name: Construct ledger gate
        # Reviewer point #2 / TG-003 / TG-015 (plan Phase D0). Coverage above is
        # counted in FIXTURES; this gate counts it in fund-critical CONSTRUCTS —
        # language shapes and wire value classes. Both 2026-08 fund-safety bugs
        # (branch-merged locals with >=2 merged locals; a 1-byte OP_N-range
        # ByteString state value) were EMPTY CELLS in that matrix while every
        # fixture-counted gate above was green.
        #
        # Eight gates, one `it` each. Fails if a row has neither evidence nor an
        # honest `status: "UNCOVERED"` + `issue`; if a claimed `coveredBy[].path`
        # does not exist on disk OR exists but is EMPTY (so deleting a witness
        # turns its construct red instead of silently decaying into a false
        # claim); if an id in the test file's hard-coded REQUIRED_CONSTRUCTS set
        # has no row; if an id, `category`, `severity` or `kind` breaks the
        # closed enums; if a `coveredBy[].kind` does not MATCH THE SHAPE of the
        # path it claims (a `real-crypto-witness` pointing at a doc used to pass
        # every gate); if a row is backed only by a round-trip test from
        # ROUND_TRIP_ONLY_PATHS (reviewer point #4 — a self-inverse cannot catch
        # a change that moves both sides together); if a ROUND_TRIP_ONLY_PATHS
        # entry no longer names a real file (a rename silently turns the denylist
        # into a no-op); or if REQUIRED_CONSTRUCTS falls below the committed
        # MIN_REQUIRED_CONSTRUCTS floor or stops being a bijection with the
        # ledger's row ids (the reverse direction — a construct demoted by
        # deleting one line while its row stays put).
        # See conformance/README.md ⇒ "Construct ledger".
        run: cd conformance && npx vitest run construct-ledger.test.ts
      - name: Mutation corpus staleness guard
        # A mutant is a patch against a specific line of a specific compiler
        # source file. When that code is refactored the patch either stops
        # applying (silent no-op) or starts hitting DEAD code (silent survival),
        # and a survivor is indistinguishable from a genuine hole in the net.
        # That is not hypothetical: 4b0f688f moved the branch-merge decision,
        # both PALMER-1 mutants kept applying to lines that no longer gate
        # anything, and conformance/mutation/baseline.json went on recording
        # them as CAUGHT. The only check that would have noticed is the
        # baseline-regression step in fuzzer-nightly.yml, which is nightly-only
        # and had not run since.
        #
        # This step runs no gates and mutates nothing — it just asserts every
        # mutant's find string still occurs EXACTLY ONCE in the file it patches
        # (milliseconds), so "the corpus no longer describes the code" fails
        # loudly on the PR that moves the code, not weeks later as a mystery
        # survivor. See conformance/mutation/__tests__/mutant-staleness.test.ts.
        run: npx vitest run conformance/mutation

  conformance-anf-parity:
    # Cross-interpreter parity for the ANF lenient interpreter shipped by
    # every SDK (TS / Go / Rust / Python / Zig / Ruby / Java). Each non-TS
    # driver is a small CLI under conformance/anf-interpreter/drivers/<lang>/
    # that the vitest harness spawns per fixture. RUNAR_ANF_DRIVERS_STRICT=1
    # turns the local "skip on missing driver" gate into a hard failure so a
    # silently-rotted SDK shows up in CI rather than locally.
    name: Conformance — ANF interpreter parity
    runs-on: ubuntu-latest
    needs: [lint-no-silent-skips, conformance-allowlist-audit]
    env:
      RUNAR_ANF_DRIVERS_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: compilers/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo registry + target dir. Rust builds dominate this job's
      # wall clock and the inputs (Cargo.lock + rustc version) are stable
      # between runs, so a cache hit skips a full dependency rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            conformance/anf-interpreter/drivers/rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Read-only restore of the turbo build-output cache (see the ts-compiler
      # job's writer step for the staleness argument). This job runs in parallel
      # with ts-compiler, so it restores the newest prior entry via restore-keys
      # and `pnpm run build` rebuilds only the packages that actually changed.
      - name: Restore turbo build outputs
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build Rust ANF driver
        run: cd conformance/anf-interpreter/drivers/rust && cargo build --release
      - name: Build Java ANF driver (fat jar)
        run: cd conformance/anf-interpreter/drivers/java && gradle fatJar --no-daemon
      - name: Build Zig ANF driver
        run: cd conformance/anf-interpreter/drivers/zig && zig build -Doptimize=ReleaseSafe
      - name: Run ANF cross-interpreter parity — lenient (7 SDKs × 6 fixtures)
        run: pnpm run conformance:anf-parity
      - name: Run ANF cross-interpreter parity — strict (7 SDKs × 7 fixtures)
        # Strict mode also asserts cross-tier byte-equality of the
        # `{error, methodName, bindingName}` envelope on the fixtures
        # whose `assert(...)` predicates fire under mocked crypto.
        run: pnpm run conformance:anf-parity:strict
      - name: Run ANF cross-interpreter parity — real-crypto (7 SDKs × 2 fixtures)
        # Real-crypto mode performs ECDSA verify against the supplied
        # 32-byte sighash, matching the on-chain CHECKSIG semantic. The
        # pass fixture should succeed (sig verifies against constructor
        # pubKeyHash + sighash); the fail fixture should produce
        # AssertionFailureError at the assert(checkSig(...)) binding.
        run: pnpm run conformance:anf-parity:real-crypto

  runar-verification:
    name: Runar Verification (Lean 4)
    # Self-contained — only runs `lake build` + Lean tests against the
    # in-repo conformance fixtures. No artifacts consumed from upstream
    # compiler/SDK jobs, so we don't gate it on their (sometimes flaky,
    # sometimes pre-existing) failures.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | bash -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache elan and Lake build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            runar-verification/.lake/build
          key: runar-verification-${{ runner.os }}-${{ hashFiles('runar-verification/lean-toolchain', 'runar-verification/lakefile.lean', 'runar-verification/lake-manifest.json') }}
          restore-keys: |
            runar-verification-${{ runner.os }}-
      - name: Build (lean lib + test exes)
        working-directory: runar-verification
        run: |
          lake build
          echo "checking every tracked Lean module"
          while IFS= read -r file; do
            if [ "$file" = "./lakefile.lean" ]; then
              continue
            fi
            module="${file#./}"
            module="${module%.lean}"
            module="${module//\//.}"
            lake build "$module" >/dev/null
          done < <(find . -name '*.lean' -not -path './.lake/*' | sort)
          lake build pipelineGolden goldenLoad roundtrip differential pipelineConformance
      - name: Check TCB drift
        working-directory: runar-verification
        run: ./scripts/check-tcb-drift.sh
      - name: Verify all discovered fixtures parse + satisfy WF
        working-directory: runar-verification
        run: lake env ./.lake/build/bin/goldenLoad | tee /tmp/goldenload.out
      - name: Assert README discovered-count matches goldenLoad runtime count
        working-directory: runar-verification
        # DOC-003 drift guard: goldenLoad walks conformance/tests with readDir
        # (no hardcoded allowlist) and prints "found N expected-ir.json files".
        # The README status table is the only place the count is written by
        # hand, so it silently goes stale when fixtures are added. This step
        # reuses the goldenLoad output from the previous step (no extra Lean
        # build) and fails if the README's "discovered" literal != runtime N.
        run: |
          set -o pipefail
          found=$(grep -oE 'found [0-9]+ expected-ir.json files' /tmp/goldenload.out | grep -oE '[0-9]+' | head -n1)
          if [ -z "$found" ]; then
            echo "FAIL: could not parse 'found N' from goldenLoad output"; exit 1
          fi
          # Extract N from the README row: "| Conformance fixtures discovered ... | N/N (...) |"
          readme=$(grep -E 'Conformance fixtures discovered' README.md | grep -oE '[0-9]+/[0-9]+' | head -n1 | cut -d/ -f1)
          echo "goldenLoad found=$found  README discovered=$readme"
          if [ "$found" != "$readme" ]; then
            echo "FAIL: README 'Conformance fixtures discovered' ($readme) != goldenLoad runtime count ($found)."
            echo "       Update runar-verification/README.md status table to $found/$found."
            exit 1
          fi
      - name: Verify all discovered fixtures round-trip through ANF JSON
        working-directory: runar-verification
        run: lake env ./.lake/build/bin/roundtrip
      - name: Verify pipelineConformance (2-tier classifier)
        id: conformance-gate
        # Wraps the pipelineConformance binary with ulimit -s unlimited
        # (fallback to 65520 KiB) because lowering deep-recurses on SLH-DSA
        # fixtures. The wrapper exits nonzero only on hard-failure buckets
        # (DEFERRED-parse-failure, DEFERRED-not-well-formed); soft buckets
        # (DEFERRED-compile-safe-error, DEFERRED-no-public-method) are
        # reported but do not fail the gate. Current expected:
        # VERIFIED-modulo-codegen-axioms = 63/63 (discovered dynamically),
        # 0 hard failures.
        run: ./runar-verification/scripts/run-pipeline-conformance.sh | tee /tmp/pconf.out
      - name: Verify byte-exact regression gate (34/49 live fixtures)
        id: byte-exact-gate
        working-directory: runar-verification
        # The pipelineGolden binary enforces three regression gates and
        # exits nonzero on any:
        #   1. Total byte-exact count must not drop below 34.
        #   2. Every baseline fixture (34 names) must still produce
        #      byte-identical hex against the TS reference.
        #   3. Notice (non-fatal) for fixtures that have flipped to
        #      byte-exact and should be promoted into baselineMatches.
        # Linux has no dyld __DATA_CONST check, so the native exe runs
        # directly here. Native is ~50-100x faster than the interpreter;
        # the multi-MB cryptoAxiomPending fixtures count only when backed
        # by stored Lean-produced constants or when full mode runs.
        # The captured output is parsed via shell-only substitution
        # (no GitHub event inputs are interpolated into shell).
        run: |
          set -o pipefail
          lake env ./.lake/build/bin/pipelineGolden | tee /tmp/pgolden.out
          line=$(grep -E '^PIPELINE GOLDEN:' /tmp/pgolden.out | tail -n1)
          count=${line#PIPELINE GOLDEN: }
          echo "byte_exact=${count}" >> "$GITHUB_OUTPUT"
      - name: Emit verification step summary
        if: always()
        env:
          # Internal output from previous step — produced entirely by
          # tools in this repo, never by user-controlled GitHub event
          # data. Quoted via env: per workflow-injection guidelines.
          BYTE_EXACT: ${{ steps.byte-exact-gate.outputs.byte_exact }}
        run: |
          {
            printf '## Rúnar Lean 4 Verification\n\n'
            printf '| Check | Result |\n'
            printf '|-------|--------|\n'
            printf '| Parse + WF | 56/56 |\n'
            printf '| ANF JSON round-trip | 56/56 |\n'
            if [ -n "${BYTE_EXACT:-}" ]; then
              printf '| Byte-exact vs. TS reference | %s |\n' "$BYTE_EXACT"
            else
              printf '| Byte-exact vs. TS reference | (binary did not run) |\n'
            fi
            printf '| pipelineConformance (modulo codegen axioms) | 56/56 |\n'
            printf '\n'
            printf 'Trust manifest: see `runar-verification/TRUST_MANIFEST.md`\n'
            printf 'Phase history: see `runar-verification/HANDOFF.md`\n'
          } >> "$GITHUB_STEP_SUMMARY"

  decompiler-roundtrip:
    # v0 decompiler (Bitcoin Script → Rúnar TS source). Gates on coverage
    # regression vs. packages/decompiler/coverage-baseline.json, never on
    # absolute pass count — the symbolic-execution lifter is still a
    # skeleton, so most contracts currently fall through to a /* RAW: ... */
    # fallback. Pipeline must run end-to-end without crashing on every
    # example + fixture, and the fingerprint DB must not silently drift.
    name: Decompiler — round-trip + fingerprint regression
    runs-on: ubuntu-latest
    needs: [ts-compiler]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Read-only restore of the turbo build-output cache written by the
      # ts-compiler job (this job `needs:` it). See that job's writer step for
      # the staleness argument.
      - name: Restore turbo build outputs
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Decompiler typecheck
        run: pnpm --filter runar-decompiler run typecheck
      - name: Decompiler round-trip tests (Tier 1 + 2 + 3, regression gate)
        run: pnpm --filter runar-decompiler run test
      - name: Decompiler coverage matrix
        run: pnpm --filter runar-decompiler run coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decompiler-coverage-matrix
          path: packages/decompiler/coverage.json
      - name: Fingerprint DB drift check
        # If a peephole rule or EC-optimizer rewrite changed the emitted
        # template bytes, regenerated fingerprints.json will differ from the
        # checked-in copy and this step fails. Fix by running
        # `pnpm run decompiler:fingerprints:check` locally and committing.
        run: pnpm run decompiler:fingerprints:check
      - name: Templates manifest drift check
        # If the corpus changed (new contract added, source edited, or
        # compiler output shifted), the regenerated templates-data.json
        # differs from the checked-in copy. Fix by running
        # `pnpm run decompiler:templates:check` locally and committing.
        run: pnpm run decompiler:templates:check

  sdk-conformance:
    name: SDK Output Conformance
    needs: [ts-compiler, go-sdk, rust-sdk, python-sdk, zig-sdk, ruby-sdk, java-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: packages/runar-go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo registry + target dir. Rust builds dominate this job's
      # wall clock and the inputs (Cargo.lock + rustc version) are stable
      # between runs, so a cache hit skips a full dependency rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            conformance/sdk-output/tools/rs-sdk-tool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: packages/runar-rb
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Read-only restore of the turbo build-output cache written by the
      # ts-compiler job (this job `needs:` it). See that job's writer step for
      # the staleness argument.
      - name: Restore turbo build outputs
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build Rust SDK tool
        run: cd conformance/sdk-output/tools/rs-sdk-tool && cargo build --release
      - name: Build Zig SDK tool
        run: cd conformance/sdk-output/tools/zig-sdk-tool && zig build -Doptimize=ReleaseFast
      - name: Build Java SDK driver
        run: cd conformance/sdk-output/tools/java-driver && gradle fatJar --no-daemon
      - name: Run SDK output conformance (all contracts x 7 SDKs)
        run: cd conformance/sdk-output && npx tsx runner/sdk-runner.ts
      - name: Run vertical compiler<->SDK pins (constructorSlots + codeSeparator offsets)
        # Horizontal parity (the step above) proves the seven SDKs agree; it
        # cannot prove they are right. This gate compares each tier's deployed
        # locking script against an independent derivation from the compiler's
        # own artifact, and checks the artifact's constructorSlots /
        # codeSeparatorIndices against an opcode walk of the script it ships.
        # Reuses the SDK drivers built above. See conformance/sdk-vertical/README.md.
        run: cd conformance && npx tsx sdk-vertical/runner/vertical-runner.ts

  script-execution:
    # S1 execution oracle (TS-GAP-003): compile every conformance contract to
    # fold-ON deployed bytes and execute real spends — plus adversarial
    # MUST-FAIL near-miss witnesses — through the go-sdk Bitcoin Script engine.
    # This is the only gate that executes fold-ON bytes against a script engine
    # with per-contract witnesses.
    name: Script Execution Oracle
    needs: [ts-compiler, go-compiler]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The suite's compileRúnar helper imports packages/runar-compiler/dist,
      # so the TS workspace must be built first.
      # Read-only restore of the turbo build-output cache written by the
      # ts-compiler job (this job `needs:` it). See that job's writer step for
      # the staleness argument.
      - name: Restore turbo build outputs
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run script-execution oracle
        run: cd conformance && go test -v -timeout 1200s .

  # ---------------------------------------------------------------------------
  # Integration — regtest node tests
  # ---------------------------------------------------------------------------

  integration:
    name: Integration Tests
    needs:
      - ts-compiler
      - go-compiler
      - go-sdk
      - rust-compiler
      - rust-sdk
      - python-compiler
      - python-sdk
      - zig-compiler
      - zig-sdk
      - ruby-compiler
      - ruby-sdk
      - java-compiler
      - java-sdk
    runs-on: ubuntu-latest
    env:
      RPC_URL: http://localhost:18332
      RPC_USER: regtest
      RPC_PASS: regtest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: compilers/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo registry + target dir. Rust builds dominate this job's
      # wall clock and the inputs (Cargo.lock + rustc version) are stable
      # between runs, so a cache hit skips a full dependency rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            integration/rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # bsv-sdk gives the SDK its real ECDSA path; slh-dsa unmasks the
      # SLH-DSA negative-tests so they verify against the real FIPS 205
      # impl rather than the no-op fallback (which now raises rather
      # than silently mock-true-ing).
      - run: pip install pytest bsv-sdk slh-dsa
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: integration/ruby
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Read-only restore of the turbo build-output cache written by the
      # ts-compiler job (this job `needs:` it). See that job's writer step for
      # the staleness argument.
      - name: Restore turbo build outputs
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-dist-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'package.json') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Java integration's ContractCompiler spawns `node --import tsx`; tsx
      # lives in conformance/ (not pnpm-workspace), so install it explicitly.
      - run: cd conformance && npm ci

      - name: Pre-create regtest node config with test credentials
        run: |
          mkdir -p integration/regtest-data/n1
          printf '%s\n' \
            'port=18333' 'rpcbind=0.0.0.0' 'rpcport=18332' \
            'rpcuser=regtest' 'rpcpassword=regtest' 'rpcallowip=0.0.0.0/0' \
            'dnsseed=0' 'listenonion=0' 'listen=1' 'server=1' 'rest=1' 'regtest=1' \
            'usecashaddr=0' 'txindex=1' 'excessiveblocksize=1000000000' \
            'maxstackmemoryusageconsensus=100000000' 'maxscriptsizepolicy=0' \
            'maxscriptnumlengthpolicy=0' 'maxstackmemoryusagepolicy=100000000' \
            'maxtxsizepolicy=0' 'genesisactivationheight=1' 'chronicleactivationheight=1' \
            'minminingtxfee=0.00000001' \
            'acceptnonstdtxn=0' \
            > integration/regtest-data/n1/bitcoin.conf
          # acceptnonstdtxn=0 hardens the CI oracle (issues #40/#42/#44): with
          # genesisactivationheight=1 the node enforces post-Genesis script-verify
          # standardness (CLEANSTACK, NULLFAIL, NULLDUMMY, minimal-push) at
          # sendrawtransaction acceptance — matching mainnet ARC. Large post-Genesis
          # scripts (SLH-DSA/Schnorr) stay acceptable. Keep in sync with
          # integration/regtest.sh.

      - name: Start BSV regtest node
        run: cd integration && ./regtest.sh start

      - name: Go integration tests
        # Timeout raised to 30min because TestRollupGroth16WAMSM_AdvanceState
        # broadcasts a ~900KB Groth16 MSM tx and regularly spends 10+ minutes
        # in the RPC round-trip on the CI runner. Runs comfortably in <1min
        # locally when the node is not under memory pressure.
        run: cd integration/go && go test -tags integration -v -timeout 1800s
        timeout-minutes: 35

      - name: TypeScript integration tests
        run: cd integration/ts && npx vitest run

      - name: Rust integration tests
        run: cd integration/rust && cargo test --release -- --ignored
        timeout-minutes: 10

      - name: Python integration tests
        run: cd integration/python && PYTHONPATH=../../compilers/python:../../packages/runar-py pytest -v

      - name: Ruby integration tests
        run: cd integration/ruby && bundle exec rspec --format documentation

      - name: Zig integration tests
        run: cd integration/zig && zig build test
        timeout-minutes: 5

      - name: Java integration tests
        run: cd integration/java && gradle test -Drunar.integration=true --no-daemon
        timeout-minutes: 35

      - name: Install end-to-end Ruby deps
        run: cd examples/end2end-example/ruby && bundle install

      - name: All end-to-end PriceBet examples
        run: pnpm run e2e:all

      - name: Stop regtest node
        if: always()
        run: cd integration && ./regtest.sh stop

  # GAP-105: the PR/push integration job above runs against an SV Node regtest.
  # Teranode is the other production node implementation; its compose stack
  # (10+ microservices + ~10k-block pre-mine) is too heavy to run on every PR,
  # so this leg is opt-in via `workflow_dispatch` with `run_teranode=true`. It
  # reuses integration/teranode.sh and the same Go integration suite under
  # NODE_TYPE=teranode, giving an automated (not just manual) Teranode path.
  integration-teranode:
    name: Integration Tests (Teranode — opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_teranode
    needs: [go-compiler, go-sdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: compilers/go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Start Teranode + run Go integration suite (NODE_TYPE=teranode)
        run: pnpm run integration:teranode:run
      - name: Stop Teranode
        if: always()
        run: cd integration && ./teranode.sh stop
