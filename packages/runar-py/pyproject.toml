[project]
name = "runar"
version = "1.0.0-rc.1"
description = "Runar - TypeScript-to-Bitcoin Script Compiler (Python runtime)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Siggi Oskarsson", email = "siggi.oskarsson@gmail.com" }]
keywords = ["bitcoin", "bitcoin-sv", "bsv", "smart-contracts", "bitcoin-script", "compiler"]
dependencies = []

[project.urls]
Homepage = "https://github.com/icellan/runar"
Repository = "https://github.com/icellan/runar"
Issues = "https://github.com/icellan/runar/issues"

[project.optional-dependencies]
# R-213: this used to read `crypto = ["coincurve>=20.0"]`. Nothing in the
# package has ever imported coincurve, so `pip install runar[crypto]` installed
# a C extension and changed nothing — while the README sold it as "Optional
# secp256k1 backend". The backend LocalSigner actually consults is bsv-sdk
# (see runar/sdk/local_signer.py, which falls back to the bundled pure-Python
# runar.ecdsa when it is absent), so the extra now installs that and the
# promise is true. Same distribution as `script-vm`, kept as a separate name
# because the two answer different questions: "sign faster" vs "run Script".
crypto = ["bsv-sdk>=1.0"]
# Test dependencies. bsv-sdk is REQUIRED to run the suite: MockProvider's
# fail-closed broadcast validation (testing-gap remediation Phase A5) executes
# every known input through its Spend interpreter, and raises
# BroadcastValidationUnavailable rather than silently skipping when it is
# absent. runar itself stays zero-dependency at RUNTIME — this is a test-only
# requirement, and CI already installs it for the packages/runar-py job.
dev = ["pytest>=7.0", "bsv-sdk>=1.0"]
# Off-chain Bitcoin Script VM (runar.sdk.script_vm) wraps the bsv-blockchain
# bsv-sdk Spend interpreter. Optional — runar-py itself stays zero-dependency.
script-vm = ["bsv-sdk>=1.0"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["runar*"]
