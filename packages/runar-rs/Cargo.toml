[package]
name = "runar-lang"
version = "1.0.0-rc.1"
edition = "2021"
description = "Types and mock functions for Rúnar smart contract development in Rust"
license = "MIT"
repository = "https://github.com/icellan/runar"
homepage = "https://github.com/icellan/runar"
keywords = ["bitcoin", "smart-contracts", "bsv", "script"]
categories = ["cryptography"]

[dependencies]
runar-lang-macros = { version = "1.0.0-rc.1", path = "../runar-rs-macros" }
runar-compiler-rust = { version = "1.0.0-rc.1", path = "../../compilers/rust" }
sha2 = "0.10"
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
bs58 = { version = "0.5", features = ["check"] }
# >=0.2.89 is a REQUIREMENT, not a preference: 0.1.x builds the BIP-143
# `hashPrevouts` in the wrong order for `input_index > 0` (see
# docs/audit/upstream-bsv-sdk-bip143-hashprevouts.md). 0.2.89 fixes it, and
# `<0.3` keeps this crate on the same bsv-sdk as its `runar-compiler-rust`
# path dependency instead of building two copies.
bsv-sdk = ">=0.2.89, <0.3"
num-bigint = "0.4"
ureq = "2"
# Floor for RUSTSEC-2026-0285. ureq 2.12.1 still admits rustls 0.23.37.
rustls = ">=0.23.45"
